<style>
  html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;margin:0;height:100%;background:#1d2233;color:#cfd3e8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  *{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
  #wrap{display:flex;align-items:center;justify-content:center;width:100%}
  #stage{grid-area:S;position:relative;width:min(100vw,calc((100vh - 64px)*16/9));width:min(100vw,calc((100dvh - 64px)*16/9));aspect-ratio:16/9;container-type:inline-size;background:#000}
  canvas{image-rendering:pixelated;width:100%;height:100%;display:block;touch-action:none}
  #bar{min-height:52px;display:flex;align-items:center;justify-content:center;padding:6px 12px;box-sizing:border-box;text-align:center}
  @media (max-height:500px){#bar{min-height:26px;padding:2px 8px}#strip{font-size:11px}}
  #strip{color:#e8ebff;text-decoration:none;font-size:14px;line-height:1.35}
  #strip b{color:#ffd23f}
  #strip .days{color:#ff9a5a;font-weight:800}
  #strip:hover b{text-decoration:underline}
  /* ---------- touch controls (only on touch devices) ---------- */
  .pad{display:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #padL{grid-area:L}#padR{grid-area:R}
  body.touch #wrap{display:grid;touch-action:none}
  body.touch .pad{display:flex;align-items:center;justify-content:center;gap:12px}
  #wrap[data-mode=side]{grid-template-columns:1fr auto 1fr;grid-template-areas:"L S R";align-items:center}
  #wrap[data-mode=side] #padR{flex-direction:column}
  #wrap[data-mode=below]{grid-template-columns:1fr 1fr;grid-template-areas:"S S" "L R";align-items:center;justify-items:center}
  #wrap[data-mode=below] #padR{flex-direction:row}
  #wrap[data-mode=overlay]{grid-template-columns:1fr;grid-template-areas:"A";justify-items:center}
  #wrap[data-mode=overlay]>*{grid-area:A}
  #wrap[data-mode=overlay] .pad{z-index:6;opacity:.55;pointer-events:none}
  #wrap[data-mode=overlay] #padL{align-self:end;justify-self:start;margin:0 0 6px calc(50% - var(--sw)/2 + 8px)}
  #wrap[data-mode=overlay] #padR{align-self:end;justify-self:end;margin:0 calc(50% - var(--sw)/2 + 8px) 6px 0;flex-direction:column}
  #wrap[data-mode=overlay] .pad>*{pointer-events:auto}
  #joy{position:relative;width:var(--d);height:var(--d);border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.4);touch-action:none;box-sizing:border-box}
  #joy i{position:absolute;color:rgba(255,255,255,.55);font-style:normal;font-size:calc(var(--d)*.14);line-height:1}
  #joy .u{left:50%;top:6%;transform:translateX(-50%)}#joy .d{left:50%;bottom:6%;transform:translateX(-50%)}
  #joy .l{left:7%;top:50%;transform:translateY(-50%)}#joy .r{right:7%;top:50%;transform:translateY(-50%)}
  #knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(255,210,63,.8);border:3px solid #fff3b0;box-sizing:border-box}
  .tbtn{width:var(--b);height:var(--b);border-radius:50%;border:3px solid rgba(255,255,255,.55);color:#fff;font:800 calc(var(--b)*.19)/1 system-ui,sans-serif;touch-action:none;box-sizing:border-box;padding:0;cursor:pointer;text-shadow:0 1px 2px #000}
  #btnJump{background:rgba(70,190,110,.5)}#btnAxe{background:rgba(240,80,60,.5)}
  .tbtn.on{filter:brightness(1.6);transform:scale(.94)}
  #btnPause{width:calc(var(--b)*.5);height:calc(var(--b)*.5);border-radius:12px;background:rgba(255,255,255,.18);font-size:calc(var(--b)*.2)}
  /* call-to-action card over the game (pause / game over / ending) */
  #cta{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,13,36,.86);z-index:5}
  #cta[hidden]{display:none}
  #cta .card{box-sizing:border-box;width:86cqw;max-height:94%;overflow:hidden;text-align:center;background:#231c3d;border:.7cqw solid #ffd23f;border-radius:1.4cqw;padding:2cqw 3cqw;display:flex;flex-direction:column;align-items:center;gap:1.3cqw}
  #cta .head{font-size:2.5cqw}
  #cta .kicker{font-weight:800;letter-spacing:.3cqw;color:#9fb4ff}
  #cta .sub{color:#cfd3e8}
  #cta .row{display:flex;align-items:center;justify-content:center;gap:2.5cqw;width:100%}
  #cta .cd{flex:0 0 27cqw}
  #cta .covers{width:50cqw;height:auto;display:block;border-radius:1cqw;background:#fff}
  #cta .small{color:#e8ebff;font-size:2.1cqw}
  #cta .count{font-weight:900;color:#ff7a3a;font-size:6.6cqw;line-height:1.05;margin-top:.4cqw}
  #cta .count.hot{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07);color:#ff4b5c}}
  #cta .btn{display:block;background:#ffd23f;color:#2a1d0a;font-weight:900;text-decoration:none;text-transform:uppercase;font-size:3.1cqw;line-height:1.15;padding:1.5cqw 3cqw;border-radius:1cqw;box-shadow:0 .6cqw 0 #b88a1a}
  #cta .btn:hover{background:#ffe27a}
  #cta .url{color:#9fb4ff;font-size:2.2cqw}
  #cta .again{font:inherit;font-weight:800;font-size:2.4cqw;color:#e8ebff;background:transparent;border:.3cqw solid #5a5290;border-radius:1cqw;padding:.7cqw 3cqw;cursor:pointer}
  #cta .again:hover{border-color:#ffd23f;color:#ffd23f}
</style>

function beep(f,d=.08,type='square',vol=.04,slide=0){

    const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,n);

    if(overlap(a,{x:f.x,y:f.y,w:f.w,h:f.h})){hero.hitSet.add(f);f.hp-=d;f.flash=6;sfx.hit();if(f.type!=='stump')engage(f);knock(f);if(f.hp<=0)killFoe(f);else burst(f.x+f.w/2,f.y+f.h/2,'#fff',4)}
  }

  if(boss&&boss.state==='fight')for(const h of boss.heads){
    if(h.dead||hero.hitSet.has(h))continue;
    if(overlap(a,{x:h.x-4,y:h.y,w:22,h:12})){hero.hitSet.add(h);h.hp-=d;h.flash=6;sfx.hit();engage('boss');burst(h.x,h.y+5,['#ff7a3a','#ffd23f'],6);
      if(h.hp<=0){h.dead=true;addPts(10);sfx.kill();burst(h.x+8,h.y+5,['#ff7a3a','#ffd23f','#fff'],20);for(let i=0;i<3;i++)addCoin(h.x+i*8,h.y+14)}}
  }
}

/* ---------- update ---------- */
function update(){
  t++;
  if(phase==='moon'){t--;updateMoon();return}
  if(lock&&(lock==='boss'?!(boss&&boss.state==='fight'):(lock.dead||lock.x<-50||lock.x>W+40)))lock=null;
  const v=lock?0:speed();
  const wt=!power||t%2===0; // time slows down for everyone but the hero while powered up
  if(wt)dist+=v;
  if(inv>0)inv--;if(shake>0)shake--;if(flash>0)flash--;if(gcool>0)gcool--;
  if(power>0&&--power===0){setSize(12,16);popup={s:'ZASE NORMÁLNY',t:60,c:'#fff'}}
  if(popup&&--popup.t<=0)popup=null;
  if(wt&&dist>=nextSpawn&&phase!=='ending')spawnNext();

  if(phase==='earth'&&points>=100&&bossCount>=1&&!boss&&!lock){
    phase='ending';edgeX=W+240;nextBoss=1e12;nextGoose=1e12;platforms=platforms.filter(p=>p.x<W);
    popup={s:'KONIEC ZEME!',t:140,c:'#ffd23f'};shake=12;sfx.fire();
    for(let i=0;i<3;i++)addCoin(W+30+i*55,GROUND-16,'h'); // stock up on hearts before the jump into space
  }
  if(phase!=='earth'&&wt)edgeX-=v;
  if(phase==='ending'&&t%3===0)parts.push({x:edgeX-2,y:GROUND+rnd(0,H-GROUND),vx:rnd(-.6,.2),vy:rnd(0,1),l:36,c:pick(['#b0713f','#8e5832'])});
  if(phase==='ending'&&hero.x+hw/2>=edgeX){
    phase='space';spaceT=0;hero.vy=0;hero.onGround=false;
    if(hero.mounted){hero.mounted.ridden=false;hero.mounted.leaving=true;hero.mounted=null}
    geese=[];platforms=[];foes=foes.filter(f=>f.type==='witch');nextSpawn=dist+60;
    popup={s:'PLÁVAŠ VO VESMÍRE...',t:150,c:'#9fd8ff'};shake=10;
  }
  if(phase==='space'){
    spaceT++;
    if(!hero.jet&&spaceT>90&&spaceT%300===90&&!coins.some(c=>c.type==='j'))addCoin(W+10,clamp(hero.y+rnd(-30,30),20,H-40),'j');
  }
  if(boss&&boss.state==='fight'&&boss.kind!=='space'&&!geese.length&&!hero.mounted&&boss.heads.some(h=>!h.dead&&h.y<100)){if(++gooseT>420){spawnGoose();gooseT=0;sfx.honk();popup={s:'HUSA PRICHÁDZA!',t:80,c:'#fff'}}}else gooseT=0;

  // ----- hero
  const L=keys['arrowleft']||keys['a'],Rt=keys['arrowright']||keys['d'];
  const maxX=boss&&boss.state!=='leave'?Math.min(280,boss.bx-50):280;
  if(jumpBuf>0)jumpBuf--;if(bailBuf>0)bailBuf--;if(atkBuf>0)atkBuf--;
  const g=hero.mounted;
  if(g){
    g.age++;
    if(keys['arrowup']||keys['w'])hero.y-=2.2;
    if(keys['arrowdown']||keys['s'])hero.y+=2.2;
    if(L)hero.x-=3.2;if(Rt)hero.x+=3.2;
    hero.y=clamp(hero.y,10,GROUND-hh-8);hero.x=clamp(hero.x,8,maxX);hero.vy=0;
    g.x=hero.x-8;g.y=hero.y+hh-1;g.life--;
    if(g.life<=0||(bailBuf>0&&g.age>25)){hero.mounted=null;g.ridden=false;g.leaving=true;if(bailBuf>0){hero.vy=-4.4;sfx.jump();jumpBuf=0;bailBuf=0}}
    if(t%55===0){const y=rnd(24,GROUND-30),n=3+(Math.random()*3|0);for(let i=0;i<n;i++)addCoin(W+10+i*13,y+Math.sin(i)*6)}
  }else if(phase==='space'){
    const sp=hero.jet?3.2:.9;
    if(L)hero.x-=sp;if(Rt)hero.x+=sp;
    if(keys['arrowup']||keys['w']||jumpHeld)hero.y-=sp;
    if(keys['arrowdown']||keys['s'])hero.y+=sp;
    if(!hero.jet)hero.y+=Math.sin(t*.05)*.25;
    hero.x=clamp(hero.x,12,maxX);hero.y=clamp(hero.y,6,H-hh-4);hero.vy=0;hero.onGround=false;
    if(hero.jet&&t%2===0)parts.push({x:hero.x-1,y:hero.y+hh*.8,vx:rnd(-1.4,-.6),vy:rnd(-.3,.5),l:14,c:pick(['#ffb52e','#ff7a1a','#fff2a8'])});
  }else{
    if(L)hero.x-=1.8;else if(Rt)hero.x+=1.8;else if(!boss&&!lock&&hero.x>60)hero.x-=.3;
    hero.x=clamp(hero.x,12,maxX);
    if(hero.onGround)hero.coyote=5;else if(hero.coyote>0)hero.coyote--;
    if(jumpBuf>0&&hero.coyote>0){hero.vy=-5.1;hero.onGround=false;hero.coyote=0;jumpBuf=0;sfx.jump()}
    if(!jumpHeld&&hero.vy<-2)hero.vy=-2;
    const prev=hero.y+hh;hero.vy=Math.min(hero.vy+GRAV,6);hero.y+=hero.vy;const feet=hero.y+hh;
    let land=null;
    if(hero.vy>=0)for(const p of platforms)if(hero.x+hw-2>p.x&&hero.x+2<p.x+p.w&&prev<=p.y+.5&&feet>=p.y){land=p.y;break}
    if(feet>=GROUND&&hero.x+hw/2<edgeX)land=GROUND;
    if(land!==null){hero.y=land-hh;hero.vy=0;hero.onGround=true}else hero.onGround=false;
    // mount goose
    for(const gs of geese){
      if(gs.ridden||gs.leaving)continue;
      if(hero.vy>-.5&&feet>=gs.y-4&&feet<=gs.y+9&&hero.x+hw+3>gs.x&&hero.x-3<gs.x+gs.w){
        hero.mounted=gs;gs.ridden=true;gs.life=1500;gs.age=0;hero.vy=0;sfx.honk();popup={s:'LET NA HUSI!',t:70,c:'#fff'};break}
    }
  }
  if(atkBuf>0&&hero.mounted){if(gcool<=0){gcool=14;atkBuf=0;sfx.fire();const g2=hero.mounted;shots.push({x:g2.x+28,y:g2.y-6,vx:4.2,vy:0,w:9,h:7,k:'g'});shots.push({x:g2.x+9,y:g2.y+7,vx:1.1,vy:0,w:5,h:6,k:'e'})}}
  else if(atkBuf>0&&hero.swing===0){hero.swing=16;hero.hitSet.clear();atkBuf=0;sfx.swing()}
  if(hero.swing>0){chop();hero.swing--}

  // axe growth
  const target=1+Math.min(points/80,1)*2.5;axeS+=(target-axeS)*.08;
  const tier=1+Math.floor((target-1)/.85+.0001);
  if(tier>axeTier){axeTier=tier;popup={s:'SEKERA RASTIE!',t:90,c:'#ffd23f'};sfx.up()}

  // ----- world objects
  if(!wt)return;
  for(const d of decor)d.x-=v;decor=decor.filter(d=>d.x>-30);
  for(const p of platforms)p.x-=v;platforms=platforms.filter(p=>p.x+p.w>-10);
  for(const c of coins){c.x-=c.type==='j'?v*.5:v;if(c.fall){c.vy+=.15;c.y=Math.min(c.y+c.vy,GROUND-9);if(c.y>=GROUND-9)c.fall=false;else c.x+=c.vx}}
  const hb={x:hero.x+2,y:hero.y+2,w:hw-4,h:hh-3};
  for(const c of coins){
    if(c.got)continue;
    if(overlap({x:hb.x-2,y:hb.y-2,w:hb.w+4,h:hb.h+4},{x:c.x,y:c.y,w:7,h:7})){
      c.got=true;if(c.type==='h'){hearts=Math.min(MAXH,hearts+1);sfx.up()}else if(c.type==='p'){addPotion()}else if(c.type==='j'){hero.jet=true;spaceBossAt=dist+2200;sfx.up();popup={s:'JETPACK! VIEŠ LIETAŤ',t:120,c:'#ffb52e'};nextSpawn=dist+60;burst(c.x+4,c.y+4,['#ffb52e','#fff'],16)}else{addPts(1);sfx.coin()}burst(c.x+3,c.y+3,'#ffd23f',4)}
  }
  coins=coins.filter(c=>!c.got&&c.x>-10);
  for(const f of foes){
    f.t++;if(f.flash>0)f.flash--;
    // ride with platform if standing on one
    const base=phase==='space'?0:v;
    if(f.type==='witch'&&f.lapped)f.x+=2.4;   // second pass: comes back from the left and leaves to the right
    else if(lock===f&&f.vx>0){
      const stand={spider:2,witch:30,beetle:6,wasp:5,moth:24,cert:16}[f.type]||0,tx=hero.x+hw+stand;
      f.x-=clamp(f.x-tx,-f.vx*.6,f.vx);
    }else f.x-=base+f.vx;
    if(f.type==='spider'&&lock===f){
      if(f.bt===undefined)f.bt=rnd(50,80)|0;
      f.bt--;f.rear=f.bt>0&&f.bt<26;
      if(f.bt===0){f.lunge=8;sfx.hit();if(!power&&overlap(hb,{x:f.x-12,y:f.y,w:16,h:f.h}))hurt(f)}
      if(f.bt<=0)f.bt=f.bt===0?(rnd(80,120)|0):f.bt;
    }else f.rear=false;
    if(f.lunge>0)f.lunge--;
    if(f.type==='cert'){
      if(f.em<0){f.vx=0;if(f.x<hero.x+125){f.em=0;sfx.fire()}}
      else if(f.em<50){f.em++;f.vx=0;f.y=GROUND-18*f.em/50;if(f.em%5===0)parts.push({x:f.x+rnd(0,12),y:GROUND-1,vx:rnd(-.6,.6),vy:rnd(-1.8,-.6),l:20,c:pick(['#b0713f','#5b3d2e'])})}
      else{
        f.vx=f.walk;f.y=GROUND-18;
        if(f.kbT>0){f.kbT--;f.x+=f.kbv;f.kbv*=.92;f.y=GROUND-18-Math.sin((1-f.kbT/22)*Math.PI)*14;f.rear=false;f.lunge=0;f.at=Math.max(f.at||0,40)}
        const near=f.x-(hero.x+hw)<34;
        if(near||lock===f){
          if(f.at===undefined)f.at=60;
          f.at--;f.rear=f.at>0&&f.at<26;
          if(f.at===0){f.lunge=10;sfx.hit();if(!power&&overlap(hb,{x:f.x-22,y:f.y+6,w:24,h:8}))hurt(f);f.at=-1}
          if(f.at<0)f.at=90+(Math.random()*40|0);
        }else f.rear=false;
      }
      if(f.lunge>0)f.lunge--;
    }
    if(f.type==='beetle')f.y=f.by+Math.sin(f.t*.04+f.ph)*14;
    if(f.type==='wasp')f.y+=clamp(hero.y+hh/2-(f.y+7),-.7,.7);
    if(f.type==='moth'){
      f.y=f.by+Math.sin(f.t*.05+f.ph)*28;f.cd--;
      if(f.cd<=0&&f.x<W-20){f.cd=rnd(90,140);sfx.shoot();shots.push({x:f.x,y:f.y+10,vx:-1.7,vy:clamp((hero.y+8-f.y-10)/70,-1,1),w:5,h:5,k:'m'})}
    }
    if(f.type==='witch')f.y=f.by+Math.sin(f.t*.06+f.ph)*22;
    if(f.type==='robber'||f.type==='witch'){
      f.cd--;
      if(f.cd<=0&&f.x<W-16&&f.x>hero.x+24){
        f.cd=rnd(90,140);sfx.shoot();
        if(f.type==='robber')shots.push({x:f.x-8,y:f.y+9,vx:-(v+2.4),vy:0,w:4,h:2,k:'b'});
        else shots.push({x:f.x+2,y:f.y+16,vx:-(v+.4),vy:1.3,w:5,h:5,k:'m'});
        f.fire=8;
      }
      if(f.fire>0)f.fire--;
    }
    if(!f.dead&&!(f.type==='cert'&&f.em<50)&&overlap(hb,{x:f.x+2,y:f.y+2,w:f.w-4,h:f.h-3})){if(power)killFoe(f);else hurt(f.type==='stump'?null:f)}
  }
  for(const f of foes)if(f.type==='witch'&&!f.lapped&&!f.dead&&f.x<-30){f.lapped=true;f.x=-36;f.by=rnd(45,95);f.cd=rnd(40,80)}
  foes=foes.filter(f=>!f.dead&&f.x>-50&&f.x<W+60);
  for(const b of beams){
    b.t++;
    if(b.t<b.warn&&b.t%16===1)beep(760,.05,'square',.025);
    if(b.t===b.warn)sfx.fire();
    if(b.t>=b.warn&&b.t<b.warn+b.fire&&overlap(hb,b.o==='h'?{x:0,y:b.p,w:W,h:b.sz}:{x:b.p,y:0,w:b.sz,h:H}))hurt();
  }
  beams=beams.filter(b=>b.t<b.warn+b.fire);
  for(const s of shots){
    s.x+=s.vx;s.y+=s.vy;
    if(s.k==='e'){   // egg dropped by the goose: falls and explodes on the ground, a platform, an enemy or a dragon head
      s.vy=Math.min(s.vy+.2,5);
      let bm=phase!=='space'&&s.y+s.h>=GROUND-1;
      if(!bm)for(const f of foes)if(!f.dead&&!(f.type==='cert'&&f.em<50)&&overlap(s,f)){bm=true;break}
      if(!bm&&boss&&boss.state==='fight')for(const h of boss.heads)if(!h.dead&&overlap(s,{x:h.x-4,y:h.y,w:22,h:12})){bm=true;break}
      if(!bm&&s.vy>0)for(const p of platforms)if(s.x+s.w>p.x&&s.x<p.x+p.w&&s.y+s.h>=p.y&&s.y+s.h<=p.y+8){bm=true;break}
      if(bm){s.dead=true;boom(s.x+2,s.y+3)}
      if(s.x>W+30||s.y>H)s.dead=true;
      continue;
    }

      for(const f of foes)if(!f.dead&&!(f.type==='cert'&&f.em<50)&&overlap(s,f)){s.dead=true;f.hp-=axeDmg();f.flash=6;sfx.hit();if(f.type!=='stump')engage(f);knock(f);if(f.hp<=0)killFoe(f);break}
      if(!s.dead&&boss&&boss.state==='fight')for(const h of boss.heads)if(!h.dead&&overlap(s,{x:h.x-4,y:h.y,w:22,h:12})){
        s.dead=true;h.hp-=axeDmg();h.flash=6;sfx.hit();engage('boss');burst(h.x,h.y+5,['#ff7a3a','#ffd23f'],6);
        if(h.hp<=0){h.dead=true;addPts(10);sfx.kill();burst(h.x+8,h.y+5,['#ff7a3a','#ffd23f','#fff'],20);for(let i=0;i<3;i++)addCoin(h.x+i*8,h.y+14)}break}
    }else if(!s.dead&&overlap(hb,s)){s.dead=true;if(power)burst(s.x,s.y,'#fff',4);else hurt()}

    if((s.k==='f'||s.k==='g')&&t%3===0)parts.push({x:s.x+8,y:s.y+4,vx:rnd(0,.6),vy:rnd(-.4,.4),l:12,c:pick(['#ff5a1f','#ffb52e'])});
  }
  shots=shots.filter(s=>!s.dead);
  for(const b of booms)b.t++;booms=booms.filter(b=>b.t<16);
  for(const gs of geese){

    else{gs.face=-1;gs.x-=v*.55;gs.y=gs.base+Math.sin(gs.t*.08)*5}
  }
  geese=geese.filter(gs=>gs.x>-50&&gs.x<W+50&&gs.y>-30);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l--}
  parts=parts.filter(p=>p.l>0);

function updateBoss(){
  const b=boss;b.t++;
  if(b.state==='enter'){b.bx-=1;
    for(const h of b.heads){h.x=b.bx-26;h.y=headY(b,h.i)}if(b.bx<=W-84){b.state='fight';sfx.fire();popup={s:b.kind==='space'?'SEKAJ VŠETKY HLAVY!':'DOPREDU > A SEKAJ HLAVY!',t:140,c:'#ffd23f'}}}
  else if(b.state==='fight'){
    b.timer--;let alive=0;
    for(const h of b.heads){
      const by=headY(b,h.i);
      h.x=b.bx-26+Math.sin(b.t*.05+h.ph)*5;h.y=by+Math.cos(b.t*.04+h.ph*2)*4;
      if(h.flash>0)h.flash--;
      if(h.dead){h.dy+=.4;continue}
      alive++;h.cd--;
      if(h.cd<26)h.open=1;else h.open=0;
      if(h.cd<=0){
        h.cd=b.kind==='space'?rnd(170,280):rnd(110,190);sfx.fire();
        const dx=Math.max(20,h.x-hero.x),fr=dx/2.4,vy=clamp((hero.y+6-(h.y+5))/fr,-1.5,1.5);
        shots.push({x:h.x-8,y:h.y+3,vx:-2.4,vy,w:8,h:8,k:b.kind==='space'?'q':'f'});
      }
      if(overlap({x:hero.x+2,y:hero.y+2,w:hw-4,h:hh-3},{x:h.x,y:h.y,w:16,h:10})){if(!power)hurt('boss')}
    }
    if(alive===0){b.state='dead';b.dt=0;addPts(30);shake=20;sfx.kill();popup={s:'DRAK PORAZENÝ +30',t:150,c:'#ffd23f'};
      burst(b.bx+40,100,['#ff7a3a','#ffd23f','#fff','#2f8f5a'],60);for(let i=0;i<12;i++)addCoin(W-100+i*8,40+Math.sin(i)*20)}
    else if(b.timer<=0)b.state='leave';
  }
  else if(b.state==='dead'){b.dt++;if(b.dt%6===0)burst(b.bx+rnd(10,90),rnd(60,140),['#ff7a3a','#ffd23f'],5);if(b.dt>70){if(b.kind==='space'){boss=null;startMoon();return}b.state='leave';bossCount++}}
  else if(b.state==='leave'){b.bx+=1.4;if(b.bx>W+140){boss=null;nextBoss=dist+9000;if(phase==='space')spaceBossAt=dist+2000}}
}

  for(let i=0;i<3;i++){const on=power?true:i<potions;R(4+i*9,30,7,7,'#1b1530');R(5+i*9,31,5,5,on?'#c46bff':'#3a3550')}
  if(power){R(4,40,28,3,'#1b1530');R(5,41,26*power/720,1,'#c46bff')}
  const d=(dist/20|0)+' M';txt(d,W-4-txtW(d),4);
  const b='REKORD '+Math.max(best,points);txt(b,W-4-txtW(b),12,'#c9cfee');
  if(hero.mounted){const g=hero.mounted,w=24,f=clamp(g.life/1500,0,1);R(hero.x+hw/2-w/2,hero.y-8,w,3,'#1b1530');R(hero.x+hw/2-w/2+1,hero.y-7,(w-2)*f,1,f<.25?'#ff4b5c':'#7cf08a')}
  if(boss&&boss.state==='fight'){
    let hp=0,mx=0;for(const h of boss.heads){hp+=Math.max(0,h.hp);mx+=h.max}
    const w=110,x=(W-w)/2;R(x-1,H-11,w+2,6,'#1b1530');R(x,H-10,w*hp/mx,4,'#ff5a1f');{const nm=boss.kind==='space'?'VESMÍRNY DRAK':'DRAK';txt(nm,(W-txtW(nm))/2,H-18,boss.kind==='space'?'#7ff0ff':'#ff9a5a')}
  }
  if(popup){const a=popup.t<20?popup.t/20:1;ctx.globalAlpha=a;ctxt(popup.s,52,popup.c,2);ctx.globalAlpha=1}
}
/* ---------- crowdfunding call-to-action (edit the texts here) ---------- */
const CAMPAIGN={
  url:'https://startlab.sk/lomidrevo-junior?utm_source=hra&utm_medium=web&utm_campaign=lomidrevo-junior',
  shown:'startlab.sk/lomidrevo-junior',
  end:new Date(2026,10,5),                       // campaign ends 5 Nov 2026 (31 days after 5 Oct)
  cta:'PODPOR NOVÝ KOMIKS LOMIDREVO JUNIOR',
  smallLine:'Do konca kampane',
  kicker:{pause:'PAUZA',over:'KONIEC HRY',win:'KONIEC'},
  sub:{pause:'',over:'Nevadí, skús to znova!',win:'Hrdina našiel mamu. Ďakujeme, že si hral!'},
  again:{pause:'Pokračovať',over:'Hrať znova',win:'Hrať znova'}
};
const daysLeft=()=>Math.ceil((CAMPAIGN.end-new Date())/86400000);
const skDays=n=>n===1?'1 deň':(n>=2&&n<=4)?n+' dni':n+' dní';
function countdown(){
  const n=daysLeft();
  if(n<=0)return{small:'',big:'',strip:'Kampaň sa skončila – ďakujeme za podporu!',hot:false};
  if(n===1)return{small:CAMPAIGN.smallLine,big:'POSLEDNÝ DEŇ!',strip:'POSLEDNÝ DEŇ KAMPANE!',hot:true};
  return{small:'Do konca kampane '+(n<=4?'zostávajú':'zostáva'),big:skDays(n).toUpperCase(),strip:'Do konca kampane '+(n<=4?'zostávajú ':'zostáva ')+skDays(n),hot:n<=3};
}
const $=id=>document.getElementById(id);
function renderStrip(){
  const c=countdown(),a=$('strip');a.href=CAMPAIGN.url;
  a.innerHTML=(c.strip?'<span class="days">⏳ '+c.strip+'</span> · ':'')+'<b>'+CAMPAIGN.cta+'</b> → '+CAMPAIGN.shown;
}
let ctaMode='';
function syncCta(){
  const m=paused&&state==='play'?'pause':state==='over'&&overT>70?'over':state==='win'&&moonT>150?'win':'';
  if(m===ctaMode)return;
  ctaMode=m;$('cta').hidden=!m;if(!m)return;
  const c=countdown();
  $('ctaKicker').textContent=CAMPAIGN.kicker[m];
  $('ctaSub').textContent=CAMPAIGN.sub[m]?' · '+CAMPAIGN.sub[m]:'';
  $('ctaSmall').textContent=c.small;$('ctaCd').style.display=c.big?'':'none';
  $('ctaCount').textContent=c.big;$('ctaCount').className='count'+(c.hot?' hot':'');
  const b=$('ctaBtn');b.href=CAMPAIGN.url;b.textContent=CAMPAIGN.cta;$('ctaUrl').textContent=CAMPAIGN.shown;
  $('ctaAgain').textContent=CAMPAIGN.again[m];
}
$('ctaAgain').onclick=()=>{if(ctaMode==='pause')paused=false;else startGame()};
renderStrip();setInterval(renderStrip,60000);

/* ---------- on-screen touch controls: joystick (walk / steer), SKOK, SEKERA, pause ---------- */
const wrap=$('wrap'),stageEl=$('stage'),barEl=$('bar'),joy=$('joy'),knob=$('knob');
function setTouch(on){TOUCH=on;document.body.classList.toggle('touch',on);layoutTouch()}
function layoutTouch(){
  if(!TOUCH){wrap.dataset.mode='none';stageEl.style.width='';return}
  const vw=window.innerWidth,vh=window.innerHeight,availH=vh-barEl.offsetHeight;
  let mode,sw,d,b;
  if(availH-vw*9/16>=120){                       // controls fit under the picture (phone portrait, tablets)
    mode='below';sw=vw;const rowH=availH-vw*9/16;d=Math.min(rowH-16,vw/2-20,150);b=Math.min(d,(vw/2-72)/2,110);
  }else{
    const sw0=Math.min(vw,availH*16/9),swS=Math.min(vw-196,availH*16/9);
    if(swS>=sw0*.72){                            // controls in the side margins (phone landscape)
      mode='side';sw=swS;const side=(vw-sw)/2;d=Math.min(side-16,availH-24,140);b=Math.min(side-16,(availH-70)/2.5,110);
    }else{mode='overlay';sw=sw0;d=Math.min(sw*.2,110);b=Math.min(sw*.16,90)}   // last resort: translucent, over the picture
  }
  wrap.dataset.mode=mode;stageEl.style.width=Math.floor(sw)+'px';
  wrap.style.setProperty('--sw',Math.floor(sw)+'px');
  wrap.style.setProperty('--d',Math.max(60,Math.floor(d))+'px');wrap.style.setProperty('--b',Math.max(48,Math.floor(b))+'px');
}
let joyId=null;
function joyMove(e){
  const r=joy.getBoundingClientRect(),rad=r.width/2,dx=(e.clientX-(r.left+rad))/rad,dy=(e.clientY-(r.top+r.height/2))/rad,m=Math.hypot(dx,dy),k=m>1?1/m:1;
  keys.arrowleft=dx<-.35;keys.arrowright=dx>.35;keys.arrowup=dy<-.35;keys.arrowdown=dy>.35;
  knob.style.transform='translate('+(dx*k*rad*.55)+'px,'+(dy*k*rad*.55)+'px)';
}
function joyEnd(){joyId=null;keys.arrowleft=keys.arrowright=keys.arrowup=keys.arrowdown=false;knob.style.transform=''}
joy.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();try{joy.setPointerCapture(e.pointerId)}catch(_){}joyId=e.pointerId;joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
joy.addEventListener('pointerup',e=>{if(e.pointerId===joyId)joyEnd()});
joy.addEventListener('pointercancel',e=>{if(e.pointerId===joyId)joyEnd()});
function holdButton(btn,down,up){
  let id=null;
  btn.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();try{btn.setPointerCapture(e.pointerId)}catch(_){}id=e.pointerId;btn.classList.add('on');down()});
  const end=e=>{if(id===null||(e.pointerId!==undefined&&e.pointerId!==id))return;id=null;btn.classList.remove('on');if(up)up()};
  btn.addEventListener('pointerup',end);btn.addEventListener('pointercancel',end);btn.addEventListener('lostpointercapture',end);
}
let axeTimer=null;
holdButton($('btnJump'),()=>{bailBuf=8;press('jump');if(state!=='play')startGame()},()=>{jumpHeld=false});
holdButton($('btnAxe'),()=>{press('atk');if(state!=='play')startGame();clearInterval(axeTimer);axeTimer=setInterval(()=>press('atk'),120)},()=>{clearInterval(axeTimer)});
holdButton($('btnPause'),()=>{if(state==='play')paused=!paused});
window.addEventListener('resize',layoutTouch);window.addEventListener('orientationchange',()=>setTimeout(layoutTouch,200));
setTouch(TOUCH);window.addEventListener('load',layoutTouch);
// no pinch-zoom or page scrolling while playing (iOS Safari ignores user-scalable=no, so block the gestures too)
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1)||TOUCH)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(TOUCH)e.preventDefault()});
document.addEventListener('selectstart',e=>e.preventDefault());   // nothing on the page can be selected (no blue highlight on long-press / double-tap / Ctrl+A)
document.addEventListener('dragstart',e=>e.preventDefault());
addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!TOUCH)setTouch(true)},{passive:true});   // a finger touches the screen: bring the controls back


function render(){
  syncCta();
  ctx.save();
  if(shake>0)ctx.translate((Math.random()*2-1)*Math.min(shake,4),(Math.random()*2-1)*Math.min(shake,4));
  const off=state==='title'?t*1.2:dist;
  if(phase!=='earth')drawSpace(off);
  if(phase==='earth'||edgeX>0){
    if(phase!=='earth'){ctx.save();ctx.beginPath();ctx.rect(0,0,Math.min(W,Math.max(0,edgeX)),H);ctx.clip()}
    drawBackground(off);
    if(phase!=='earth'){ctx.restore();const ex=Math.round(edgeX);
      if(ex>0&&ex<W+10){R(ex-3,GROUND-3,3,H-GROUND+3,'#6e4226');for(let y=GROUND+4;y<H;y+=9)R(ex-(y*7%6),y,2+(y*3%4),5,'#8e5832')}}
  }
  if(phase==='moon')drawMoon();
  platforms.forEach(drawPlatform);
  decor.forEach(d=>{R(d.x-1,GROUND-2,20,1,'#8e5832');R(d.x,GROUND-1,18,4,'#2a1608');R(d.x+2,GROUND+3,14,2,'#1a0d04')});
  coins.forEach(drawCoin);
  foes.forEach(f=>({cert:drawCert,spider:drawSpider,witch:drawWitch,robber:drawRobber,beetle:drawBeetle,wasp:drawWasp,moth:drawMoth}[f.type]||drawStump)(f));
  if(boss)drawBoss();
  geese.forEach(drawGoose);
  if(state!=='over'||hearts>0){drawHero();drawAxe()}
  shots.forEach(drawShot);
  booms.forEach(drawBoom);
  beams.forEach(drawBeam);
  for(const p of parts)R(p.x,p.y,2,2,p.c);
  ctx.restore();
  if(flash>0){ctx.globalAlpha=flash/20;R(0,0,W,H,'#ff2030');ctx.globalAlpha=1}
  if(state==='play')drawHUD();
  if(phase==='moon')drawMoonUI();
  if(state==='title'){
    ctx.globalAlpha=.35;R(0,40,W,100,'#1b1530');ctx.globalAlpha=1;
    ctxt('LOMIDREVO JUNIOR',44,'#ffd23f',4);
    ctxt('VYSEKAJ SA Z TOHO!',72,'#ffffff',2);
    ctxt('SKOK  SEKAJ  LET NA HUSI  PORAZ DRAKA',98,'#fff',1);
    ctxt(TOUCH?'JOYSTICK POHYB   SKOK   SEKERA':'MEDZERNÍK SKOK   X SEKERA   ŠÍPKY POHYB   P PAUZA   M TICHO',160,'#fff',1);
    ctxt(TOUCH?'NA HUSI: JOYSTICK RIADI, SEKERA STRIEĽA A SNÁŠA VAJCIA':'NA HUSI: ŠÍPKA HORE/DOLE RIADI, X STRIEĽA A SNÁŠA VAJCIA',169,'#ffe08a',1);
    if(Math.floor(performance.now()/500)%2)ctxt(TOUCH?'KLEPNI PRE ŠTART':'STLAČ MEDZERNÍK ALEBO KLEPNI',118,'#fff',1);
    if(best)ctxt('REKORD '+best,130,'#c9cfee',1);
  }
  if(state==='over'){
    ctx.globalAlpha=.55;R(0,0,W,H,'#1b1530');ctx.globalAlpha=1;
    ctxt('KONIEC HRY',50,'#ff4b5c',4);
    ctxt('BODY '+points+'   VZDIALENOSŤ '+(dist/20|0)+' M',90,'#fff',1);
    ctxt('REKORD '+best,102,'#ffd23f',1);
    if(overT>40&&Math.floor(performance.now()/500)%2)ctxt(TOUCH?'KLEPNI A SKÚS ZNOVA':'STLAČ MEDZERNÍK A SKÚS ZNOVA',124,'#fff',1);
  }
  if(paused){ctx.globalAlpha=.5;R(0,0,W,H,'#1b1530');ctx.globalAlpha=1;ctxt('PAUZA',80,'#fff',3)}
}

/* ---------- loop (fixed 60 Hz) ---------- */
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){
    acc-=1000/60;
    if(paused)continue;
    if(state==='play')update();
    else{t++;if(state==='win')updateMoon();if(state==='over'){overT++;shake=0;for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l--}}}
  }
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
